services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker-cicd-demo:local
    container_name: docker-cicd-demo
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      # HOST_PORT: puerto en tu máquina | PORT: puerto dentro del contenedor
      - "${HOST_PORT:-8080}:${PORT:-3000}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
